// codmod default config — executed by scripts/run.sh every launch
// Never put binds here (see codmod_binds.cfg) — that would overwrite user rebinds every launch.
echo "^2codmod.cfg loaded"

// Master switch (code default is also 1). Set 0 for instant A/B vs vanilla feel.
seta cod_enable "1"
seta cod_debugHud "0"
// /cod_menu text+panel scale (0.5..1.0). Also adjustable live in the MENU UI section.
seta cod_menuScale "0.7"

// ADS (phase 3): +ads / -ads are registered in the engine (cl_input.c) as aliases for
// +wbutton6 / -wbutton6. ioRTCW SP has no console `alias` command, so cfg aliases cannot work.
// Hold is the default bind (codmod_binds.cfg). For toggle: bind MOUSE2 toggleads
// (cgame command that sticky-sends +ads/-ads).
//
// Prone (phase 6b): +prone / -prone → +wbutton7 / -wbutton7. Bound to CTRL.
//
// In-game console (`~`): prefix every command with `/` or it may not run, e.g.
//   /set cod_adsSightHeight 3
//   /cod_menu
//   /cod_menu_dump
// (This .cfg file is exec'd by the engine -- plain `set` without `/` is correct here.)
//
// Tune menu: /cod_menu  (UP/DN select, LEFT/RIGHT adjust, Shift=fast, Enter toggle,
// Bksp reset, F5 or /cod_menu_dump dump). MENU UI → cod_menuScale shrinks the overlay.
// Dumps go to console + homepath codmod_tune.log (run/home/codmod/codmod_tune.log).
//
// Per-weapon ADS iron-sight bake session (Phase 3 deferred):
//   /cod_adsTuneStart     → adsLock+adsTune, checklist (then /give all)
//   /cod_adsTuneNext      → next of 9 iron-sight weapons + load knobs
//   /cod_adsTuneSave      → append SAVE to run/home/codmod/codmod_ads_tune.log
//   /cod_adsTuneLoad      → seed Tune* from current weapon
//   /cod_adsTuneDump      → pasteable C line (also appended to the ads tune log)
//   /set cod_adsCrosshairForce 1  → keep full crosshair while ADS (for center align)
// (No cfg aliases — ioRTCW SP has no console `alias` command.)
//
// Iron-sight globals = optional master offset on absolute per-weapon cg_codAdsView
// (baked 2026-10-09 from codmod_ads_tune.log). Keep at 0 unless you want a global nudge.
// Re-tune anytime: /cod_adsTuneStart → Save (tooling kept).
// cod_adsCrosshair 2 = hide hip crosshair while ADS (iron sights are the aim point).
set cod_adsSightHeight "0"
set cod_adsSightDist "0"
set cod_adsBarrelBack "0"
set cod_adsYaw "0"
set cod_adsRoll "0"
set cod_adsPitch "0"
set cod_adsRight "0"
set cod_adsCrosshair "2"
// Modern-FPS hipfire cone: standing-still aimSpread decays to 0; floor keeps hip inaccurate until ADS.
// Tune: /cod_menu → ADS GAMEPLAY. ADS still uses cod_adsSpreadScale.
set cod_hipSpreadMin "0.55"
set cod_hipSpreadScale "1"

// Gait / FP presentation (phase 4): walk vs jog vs sprint bob + procedural sprint gun-lower.
// Fire while sprinting cancels sprint and shoots the same frame (no fire-block delay).
// Tune live: /cod_menu → GAIT / SPRINT GUN. cod_gaitEnable 0 restores vanilla pose/bob.
set cod_gaitEnable "1"
// Sprint pose raised after in-game confirm (more weapon on-screen). Was Pitch 14 / Up -3.
set cod_sprintGunPitch "9"
set cod_sprintGunFwd "-1.5"
set cod_sprintGunUp "-0.5"

// Feel (phase 5): pistol click-fire + jump/inertia/land. Tune: /cod_menu → FEEL / WEAPON FIRE.
set cod_weaponEnable "1"
set cod_pistolTapFire "1"
// Pistol ROF: vanilla 400 ms; 200 is snappy but not click-spam (was 120).
set cod_pistolNextShot "200"
set cod_pistolFireDelay "0"
// Modern-FPS fire modes: hold only sprays automatics; pistols/bolt/semi need a click per shot.
set cod_semiAutoClick "1"
set cod_jumpVelocity "250"
set cod_accelerate "8"
set cod_friction "8"
set cod_landSlowEnable "1"
// Crouch view transition (was 70 ms — too snappy). KB + pad.
set cod_duckTime "160"
// Prone transitions: snappier + short cooldown so taps aren't eaten.
set cod_proneDownTime "250"
set cod_proneUpTime "250"
set cod_proneCooldown "100"

// Quick knife (phase 5.5): snappy pull — 75ms drop/raise (vanilla 250). Tune in /cod_menu.
set cod_quickKnifeEnable "1"
set cod_knifeSwitchTime "75"
// +kick damage (vanilla 15); R3 hold on pad.
set cod_kickDamage "50"

// Vitals (phase 5b): health regen + linear stamina (no on-screen bars — see HUD).
// Tune: /cod_menu → VITALS / SPRINT / HUD. Pack: mod/codmod/codmod_hud.pk3 (not zz_* —
// engine renames zz_→sp_ when resolving pak paths).
set cod_vitalsEnable "1"
set cod_maxHealth "50"
set cod_healthRegenEnable "1"
set cod_healthRegenDelay "5000"
set cod_healthRegenRate "20"
set cod_sprintTime "8"
set cod_sprintLinear "1"
set cod_sprintRechargeDelay "600"
set cod_ammoScale "2"
set cod_interactHint "1"

// HUD (phase 5c): clip/reserve ammo, heat→ammo colour, health→crosshair + blood vignette.
set cod_hudEnable "1"
set cod_hudAmmoStyle "1"
set cod_hudHeatColor "1"
set cod_hudHealthCrosshair "1"
set cod_hudLowHealthBlood "1"
set cod_hudLowHealthStart "0.4"
set cod_hudLowHealthMaxAlpha "0.55"

// Crosshair (phase 5c follow-up): CoD 4-post bloom. ADS fades posts;
// cod_adsCrosshair 2 hides the reticle while ADS (iron sights baked).
set cod_crosshairStyle "1"
set cod_crosshairGap "4"
set cod_crosshairLength "8"
set cod_crosshairWidth "2"
set cod_crosshairDot "1"
set cod_crosshairBloom "16"
set cod_crosshairMoveBloom "14"
set cod_crosshairCrouchScale "0.55"
set cod_crosshairSprintAlpha "0.35"
set cod_crosshairOutline "1"

// Hit markers (E9): X flash around the crosshair + short tick on enemy hits.
// Headshots use a brighter/higher tick (sound/codmod/hitmarker*.wav in codmod_fx.pk3).
set cod_hitMarkerEnable "1"
set cod_hitMarkerTime "250"
set cod_hitMarkerGap "6"
set cod_hitMarkerLength "7"
set cod_hitMarkerWidth "2"
set cod_hitMarkerSound "1"

// Flashlight (phase 5d): toggle on L via codmod_binds.cfg.
// Eye-origin rend2 spot cones (not impact point-lights on the aimed wall).
// Intensity scales beam reach. MinDist unused but kept for menu.
set cod_flashlightEnable "1"
set cod_flashlightIntensity "500"
set cod_flashlightMinDist "48"
set cod_flashlightR "1"
set cod_flashlightG "0.95"
set cod_flashlightB "0.85"

// Frame pacer (docs/fps-limiter.md). Engine capabilities forced on every launch; the user-facing
// choices (com_maxfps cap, com_maxfpsMode, r_vsync) live in the GRAPHICS > DISPLAY menu and their
// first-launch defaults are in codmod_binds.cfg so they are not overwritten here.
// --vanilla never loads this file, so it keeps the legacy integer-ms limiter.
seta com_maxfpsPrecise "1"
seta com_maxfpsGpuSync "1"
seta cg_subMsecLerp "1"

// Effects level (user playtest lock 2026-10-12: 1.0 for 3D/HRTF audio). Engine default 0.8. Music default lives in codmod_binds.cfg.
seta s_volume "1"
// HD audio (E23): local codmod_hd_audio.pk3 is 48 kHz PCM; OpenAL plays native rates.
// Engine default is already 1 (CVAR_LATCH) — pin so wolfconfig cannot drop it.
// Do not redistribute the pk3. Regenerate: tools/hd-audio/remaster.sh
seta s_useOpenAL "1"


// rend2 graphics (many CVAR_LATCH — run.sh also +sets early for first boot).
// Do NOT set r_mode / resolution here — that would reset the user's video every launch.
// Baked normal/POM pack removed after A/B (looked weak / not useful).
// Flashlight shadows do NOT use r_dlightMode 2: they use a dedicated spot shadow map (r_flashlightShadow, docs/flashlight-shadows.md).
// Skipped: r_dlightMode 2 (broken), r_bloom (opengl1-only), r_pbr /
// imageUpsample / genNormalMaps (need assets or redundant with HD), sunlightMode 2
// (poor stock-map integration), parallax (rejected with POM pack).
seta cl_renderer "rend2"
seta r_dlightMode "1"
// shadow size/filter, sun rays, dynamic lights, AF, texture filter/picmip/lodbias, frame pacing:
// user-facing in GRAPHICS > ADVANCED, recommended values in codmod_gfxdefaults.cfg (not forced here).
// Anti-aliasing: r_aa (0 off, 1-4 SMAA low..ultra, 5-7 MSAA 2/4/8) is user-facing and persists in wolfconfig;
// engine default is 3 (SMAA High) and codmod_binds.cfg resets it. Not forced here.
// HDR path (defaults, pinned so wolfconfig cannot silently drop them).
seta r_hdr "1"
seta r_postProcess "1"
seta r_toneMap "1"
seta r_autoExposure "1"
seta r_floatLightmap "1"
// Specular response (auto-loads textures/*_s if present; else r_baseSpecular).
seta r_specularMapping "1"
seta r_deluxeMapping "1"
// Direct specular strength from the light-grid direction (engine default 0.1 is nearly invisible) plus
// runtime cubemaps (markers -> reflections). Both latched: run.sh also +sets them. Maps: tools/spec-bake.
seta r_deluxeSpecular "3"
seta r_cubeMapping "1"
// Forced cascaded sun shadows + god rays (stock skies have q3map_sun, not q3gl2_sun).
seta r_forceSun "1"
seta r_sunShadows "1"
seta r_sunlightMode "1"
seta r_depthPrepass "1"

// Prone (phase 6b): CTRL = +prone. Crawl scale playtest-locked 2026-10-09 (≈110 u/s).
set cod_proneScale "0.55"

// Controller (CoD4-style PAD0_*): enable + analog sticks. in_joystick is latched —
// scripts/run.sh also +set's these before IN_Init. Xbox and PlayStation share one bind map.
seta in_joystick "1"
seta in_joystickUseAnalog "1"
// Original pad prompt glyphs on interact hints (0 = text labels only).
set cod_padGlyphs "1"
// Stick look: half engine default on X; Y lower (typical FPS). Menu: CONTROLS → CONTROLLER.
// Stick snap / smoothing / target friction are always on for pads (no toggles).
// Auto-aim (stronger ADS chest pull) remains optional, off by default.
// (cod_padSensX/Y/AutoAim are user settings: defaults in bg_cod.c + codmod_binds.cfg, not set here.)
// Gyro aiming (DualSense) cvars are NOT set here (this file runs every launch and would undo menu changes);
// defaults live in bg_cod.c, reset defaults in codmod_binds.cfg.

// Vanilla default.cfg binds CTRL to +attack (same as MOUSE1). CoD uses CTRL for prone.
// Re-bind every launch so a saved wolfconfig can't keep CTRL=+attack.
// +prone is registered in the engine (cl_input.c) as an alias for +wbutton7.
bind CTRL "+prone"

// CoD4 pad defaults every launch (additive; keyboard binds unchanged). Same map for
// Xbox and PlayStation via SDL GameController → PAD0_*.
bind PAD0_LEFTSTICK_UP "+forward"
bind PAD0_LEFTSTICK_DOWN "+back"
bind PAD0_LEFTSTICK_LEFT "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_UP "+lookup"
bind PAD0_RIGHTSTICK_DOWN "+lookdown"
bind PAD0_RIGHTSTICK_LEFT "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_LEFTTRIGGER "+ads"
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTSHOULDER "weaponbank 6"
bind PAD0_RIGHTSHOULDER "weapnextinbank"
bind PAD0_A "+moveup"
// Tap Circle/B = crouch; hold ~0.4s while standing/walking = prone (CoD-style).
bind PAD0_B "+crouchprone"
// Tap Square/X = reload; hold = interact. D-pad Up also reloads. Y = next weapon.
bind PAD0_X "+reloaduse"
bind PAD0_Y "weapnext"
bind PAD0_LEFTSTICK_CLICK "+sprint"
// Tap R3 = quick knife; hold = kick.
bind PAD0_RIGHTSTICK_CLICK "+quickkick"
bind PAD0_DPAD_UP "+reload"
bind PAD0_DPAD_DOWN "+prone"
bind PAD0_DPAD_LEFT "toggleflashlight"
bind PAD0_DPAD_RIGHT "weapprev"
bind PAD0_BACK "notebook"
bind PAD0_START "togglemenu"

// Binds (ADS, quickknife, toggle crouch, flashlight, prone, pad) live in codmod_binds.cfg —
// full reset on first launch / --reset-binds / menu Defaults / /cod_resetbinds.
