// codmod pinned/internal config -- engine hook "<fs_game>.cfg": runs on EVERY launch, after wolfconfig.cfg
// (so these always apply) and before renderer/input init (so latched cvars take effect on first boot).
// Only internal values live here: never a cvar that an options menu changes (those are `seta` in
// codmod_defaults.cfg, where saved choices win). Never put binds here: they would overwrite user rebinds every
// launch. Default binds live in codmod_binds.cfg.
echo "^2codmod.cfg loaded"

// Turns the mod on and sets every cod_* feature flag and tuning value (generated, edit there). Later
// cod_* lines in this file override it.
exec codmod_tuning.cfg

// ADS (phase 3): +ads / -ads are registered in the engine (cl_input.c) as aliases for
// +wbutton6 / -wbutton6. ioRTCW SP has no console `alias` command, so cfg aliases cannot work.
// Hold is the default bind (codmod_binds.cfg). For toggle: bind MOUSE2 toggleads
// (cgame command that sticky-sends +ads/-ads).
//
// Prone (phase 6b): +prone / -prone -> +wbutton7 / -wbutton7. Bound to CTRL.
//
// In-game console (`~`): prefix every command with `/` or it may not run, e.g.
//   /set cod_adsSightHeight 3
//   /cod_menu
//   /cod_menu_dump
// (This .cfg file is exec'd by the engine -- plain `set` without `/` is correct here.)
//
// Tune menu: /cod_menu  (UP/DN select, LEFT/RIGHT adjust, Shift=fast, Enter toggle,
// Bksp reset, F5 or /cod_menu_dump dump). MENU UI -> cod_menuScale shrinks the overlay.
// Dumps go to console + homepath codmod_tune.log (run/home/codmod/codmod_tune.log).
// Tuned values pasted from a dump go into codmod_tuning.cfg (or as `set` overrides below).
//
// Per-weapon ADS iron-sight bake session (Phase 3 deferred):
//   /cod_adsTuneStart     -> adsLock+adsTune, checklist (then /give all)
//   /cod_adsTuneNext      -> next of 9 iron-sight weapons + load knobs
//   /cod_adsTuneSave      -> append SAVE to run/home/codmod/codmod_ads_tune.log
//   /cod_adsTuneLoad      -> seed Tune* from current weapon
//   /cod_adsTuneDump      -> pasteable C line (also appended to the ads tune log)
//   /set cod_adsCrosshairForce 1  -> keep full crosshair while ADS (for center align)
// (No cfg aliases -- ioRTCW SP has no console `alias` command.)
//
// Iron-sight globals = optional master offset on absolute per-weapon cg_codAdsView
// (baked 2026-10-09 from codmod_ads_tune.log). Keep at 0 unless you want a global nudge.
// Re-tune anytime: /cod_adsTuneStart -> Save (tooling kept).
// cod_adsCrosshair 2 = hide hip crosshair while ADS (iron sights are the aim point).
// Vitals HUD pack: mod/codmod/codmod_hud.pk3 (not zz_* -- engine renames zz_->sp_ when resolving pak paths).
// Flashlight (phase 5d): toggle on L via codmod_binds.cfg. Eye-origin rend2 spot cones (not impact
// point-lights on the aimed wall). User-facing flashlight settings are in codmod_defaults.cfg.
// Hit-marker sounds: sound/codmod/hitmarker*.wav in codmod_fx.pk3.

// Engine behaviours that are off in vanilla (intro, cinematics, menu cursor/briefing look).
set cl_introAlways "1"
set cl_cinematicAnyKeySkip "1"
set cl_cinLetterbox "1"
set ui_cursorTipHotspot "1"
set ui_briefing43 "1"

// Frame pacer (docs/fps-limiter.md). Engine capabilities forced on every launch; the user-facing
// choices (com_maxfps cap, com_maxfpsMode, r_vsync) live in the GRAPHICS > DISPLAY menu and their
// first-launch defaults are in codmod_defaults.cfg.
// --vanilla never loads this file, so it keeps the legacy integer-ms limiter.
set com_maxfpsPrecise "1"
set com_maxfpsGpuSync "2"
set cg_subMsecLerp "1"

// HD audio (E23): local codmod_hd_audio.pk3 is 48 kHz PCM; OpenAL plays native rates.
// Engine default is already 1 (CVAR_LATCH) -- pin so wolfconfig cannot drop it.
// Do not redistribute the pk3. Regenerate: tools/hd-audio/remaster.sh
set s_useOpenAL "1"

// rend2 graphics (many CVAR_LATCH; this file runs before renderer init, so they apply on first boot).
// Resolution/mode, AA, bloom, grade, AO, shadows, AF, texture filter, vsync, fps are user-facing: see
// codmod_defaults.cfg / codmod_gfxdefaults.cfg, never pinned here.
// Luma-POM pack was removed after A/B; parallax now uses AI heights (codmod_height.pk3, docs/parallax.md).
// Flashlight shadows do NOT use r_dlightMode 2: they use a dedicated spot shadow map (r_flashlightShadow, docs/flashlight-shadows.md).
// Skipped: r_dlightMode 2 (broken), r_bloom (user-facing setting, not pinned here), r_pbr /
// imageUpsample / genNormalMaps (need assets or redundant with HD), sunlightMode 2
// (poor stock-map integration).
// Parallax internals (CVAR_LATCH, not in any menu); the user-facing toggle (r_parallaxMapping, r_parallaxMapShadows,
// r_normalMapping) is seta'd in codmod_gfxdefaults.cfg. r_parallaxMaxSteps/FadeDist/Cavity keep engine defaults.
set r_parallaxMapOffset "0"
set r_baseParallax "0.02"
set r_parallaxFloorScale "0.5"

// Shader collapse (CVAR_LATCH, internal): drop the fake tinfx environment shine and let burnt-floor underlay shaders use lightall
// so metal/marble/burnt floors take baked _nh normals (docs/normals-coverage-plan.md). Needs r_normalMapping.
set r_codShaderCollapse "1"

set r_dlightMode "1"
set r_dlightEntities "1"
set r_dlightSpecular "1"
// Cutscene effects mask (31 = all effects).
set r_cutsceneFx "31"
// HDR path (pinned so wolfconfig cannot silently drop them).
set r_hdr "1"
set r_postProcess "1"
set r_toneMap "1"
set r_autoExposure "1"
set r_floatLightmap "1"
// Specular response (auto-loads textures/*_s if present; else r_baseSpecular).
set r_specularMapping "1"
set r_deluxeMapping "1"
// Direct specular strength from the light-grid direction (engine default 0.1 is nearly invisible) plus
// runtime cubemaps (markers -> reflections). Both latched. Maps: tools/spec-bake.
set r_deluxeSpecular "3"
// geometric specular AA: filters sub-pixel highlights on thin metal (cage bars); 0 = off, scales the variance term
set r_specularAA "1"
set r_cubeMapping "1"
// Post effect tuning (internal; the menu only has r_bloom / r_grade, docs/post-effects.md). Pinned here so
// values saved by earlier console experiments cannot linger in wolfconfig.cfg.
set r_bloomIntensity "1.8"
set r_bloomThreshold "0.8"
set r_bloomRadius "1"
set r_gradeContrast "1.06"
set r_gradeSaturation "1.1"
set r_gradeTint "0.3"
set r_gradeVignette "0.1"
set r_gradeBrightness "1.25"
// Forced cascaded sun shadows + god rays (stock skies have q3map_sun, not q3gl2_sun).
set r_forceSun "1"
set r_sunShadows "1"
set r_sunlightMode "1"
set r_depthPrepass "1"
set r_drawSunRays "1"
// Stable sun shadows (docs/sun-shadows.md): 1 snapped rotation-invariant cascades, 2 noise-free bilinear PCF,
// 4 cascade-edge blend. Latched; 0 = vanilla rend2 for A/B.
set r_sunShadowStable "7"

// Controller (CoD4-style PAD0_*): joystick enable/sticks/sens are in codmod_defaults.cfg.
// Xbox and PlayStation share one bind map. Original pad prompt glyphs on interact hints (0 = text labels only).
set cod_padGlyphs "1"
// Stick snap / smoothing / target friction are always on for pads (no toggles).

// All default binds (ADS, quick knife, prone, toggle crouch, flashlight, CoD4 pad map) live in codmod_binds.cfg,
// applied by codmod_defaults.cfg before wolfconfig.cfg (so saved rebinds win) and by menu Defaults / cod_resetbinds.

// SMAA edge detection predicated on scene depth (internal, no menu row): depth edges get a lower luma threshold,
// non-depth edges (texture/lighting speckle) a higher one. Tuning: r_smaaPredThreshold / Scale / Strength.
set r_smaaPredication "1"

// Loading screen redraw rate in Hz during the client load (internal; 0 = vanilla, redraws only at loading-string steps).
set com_loadingFps "50"
// Run CPU-only asset decodes (HD textures, big WAVs, CM_LoadMap) on a worker thread while the loading screen keeps
// presenting (internal; 0 = decode inline, see docs/loading-screen.md). Needs com_loadingFps > 0.
set com_loadingThread "1"
