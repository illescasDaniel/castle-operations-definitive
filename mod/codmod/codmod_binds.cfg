// codmod default binds only (phase 5d + controller); every user-facing seta value is in codmod_defaults.cfg.
// exec'd by codmod_defaults.cfg (every launch, before wolfconfig, so saved binds win), and by menu Defaults /
// /cod_resetbinds (binds-only reset). Re-applies vanilla defaults then codmod deltas so new binds
// (toggle crouch, flashlight, quickknife, ADS, CoD4 pad) are never missing.
// Binds in wolfconfig.cfg override these; the full settings reset is `exec codmod_defaults.cfg`.

unbindall
exec default.cfg

// ADS (phase 3), hold to aim. Was +moveup (jump) in vanilla; SPACE is already +moveup.
// Want toggle instead? bind MOUSE2 toggleads
bind MOUSE2 "+ads"

// Prone (phase 6b). Vanilla CTRL was +attack; fire is MOUSE1 only.
bind CTRL "+prone"

// Quick knife (phase 5.5): switch to knife, one swing, return to previous weapon.
bind v "quickknife"

// Interact (CoD-style F). Vanilla also binds ENTER; HUD shows F or pad glyph.
bind f "+activate"

// Reload (ensure present after unbindall; pad Square tap also reloads via +reloaduse).
bind r "+reload"

// Toggle crouch (phase 5d). Hold still available: bind c +movedown
bind c "togglecrouch"

// Flashlight toggle (phase 5d). RTCW SP has no player flashlight.
bind l "toggleflashlight"

// ---------------------------------------------------------------------------
// CoD4-style controller (Xbox + PlayStation share SDL PAD0_* map)
// ---------------------------------------------------------------------------
bind PAD0_LEFTSTICK_UP "+forward"
bind PAD0_LEFTSTICK_DOWN "+back"
bind PAD0_LEFTSTICK_LEFT "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_UP "+lookup"
bind PAD0_RIGHTSTICK_DOWN "+lookdown"
bind PAD0_RIGHTSTICK_LEFT "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_LEFTTRIGGER "+ads"
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTSHOULDER "weaponbank 6"
bind PAD0_RIGHTSHOULDER "weapnextinbank"
bind PAD0_A "+moveup"
bind PAD0_B "+crouchprone"
// Tap Square/X = reload; hold = interact. D-pad Up also reloads.
bind PAD0_X "+reloaduse"
bind PAD0_Y "weapnext"
bind PAD0_LEFTSTICK_CLICK "+sprint"
// Tap R3 = quick knife; hold = kick.
bind PAD0_RIGHTSTICK_CLICK "+quickkick"
bind PAD0_DPAD_UP "+reload"
bind PAD0_DPAD_DOWN "+prone"
bind PAD0_DPAD_LEFT "toggleflashlight"
bind PAD0_DPAD_RIGHT "weapprev"
bind PAD0_BACK "notebook"
bind PAD0_START "togglemenu"
