// codmod defaults -- engine hook "<fs_game>_defaults.cfg": runs on EVERY launch, after default.cfg and BEFORE
// wolfconfig.cfg. So it supplies the first-launch value of every user-facing setting (anything in an options
// menu), and wolfconfig's saved choices win afterwards, which is how menu changes persist.
// It is also the Reset target: exec'd after wolfconfig (menu Reset, scripts/run.sh --reset-settings, /exec)
// it puts these values back.
// Only user-facing `seta` values and the default binds live here. Internal/pinned values (cod_* tuning,
// renderer pins) belong in codmod.cfg, which runs after wolfconfig: never put those here or the menu
// cannot change them, and never `set` a user-facing cvar there.
echo "^2codmod_defaults.cfg loaded"

// Default binds (keyboard + CoD4 pad). Only matter on first launch / reset: wolfconfig stores its own binds.
exec codmod_binds.cfg

// Native monitor resolution (Automatic) in fullscreen; r_mode is latched, applies on vid_restart.
seta r_mode "-2"
seta r_fullscreen "1"

// Display: gamma (HW/soft ramp) and HDR filmic exposure (user lock 2026-10-16).
seta r_gamma "1"
seta r_cameraExposure "1.65"
// r_aa: 0 off, 4 SMAA 1x, 8 SMAA T2x (recommended), 5-7 MSAA 2x/4x/8x (MSAA applies after vid_restart). Old 1-3 act as 4.
seta r_aa "4"
// Post effects (GRAPHICS): r_bloom 0 off, 1-3 low/medium/high (default medium); r_grade 0 off, 1 on (default on); see docs/post-effects.md.
seta r_bloom "2"
seta r_grade "1"
// r_ao: 0 off, 1 hemisphere, 2-4 GTAO low/medium/high (live, no restart).
seta r_ao "2"
seta r_flashlightShadow "1"
// com_maxfps 0 = uncapped, -1 = monitor refresh (engine default is 76). r_vsync: 0 off, 1 on, 2 adaptive, 3 triple buffer, 4 low latency.
seta com_maxfps "0"
// Menu-only cap (intro, main menu, pause menu): -1 monitor refresh, 0 off, else fps.
seta com_maxfpsMenu "-1"
seta r_vsync "3"
// Recommended ADVANCED graphics values (shadows, AF, textures, pacing...). Separate file because the
// ADVANCED "Restore recommended defaults" button execs it alone.
exec codmod_gfxdefaults.cfg

// Game menu: skip the intro cutscene at startup; voice-line subtitles (needs the private subtitles pack); languages.
seta cod_skipIntro "0"
seta cod_subtitles "1"
seta cod_subtitleScale "1.0"
seta cod_textLang "en"
seta cod_audioLang "en"

// Controller: joystick support is latched (this file runs before IN_Init, so it applies on first boot).
seta in_joystick "1"
seta in_joystickUseAnalog "1"
// Stick look and auto-aim.
seta cod_padSensX "0.5"
seta cod_padSensY "0.35"
seta cod_padAutoAim "0"
// Gyro aiming: 0 off, 1 only while ADS, 2 always.
seta cod_padGyro "1"
seta cod_padGyroSens "1"
seta cod_padGyroDeadzone "0.3"

// Gameplay options (MODS > GAMEPLAY): 1 = the mod's mechanic, 0 = original RTCW behaviour. Engine code default is 0.
// Details: docs/gameplay-options.md. Slide needs Movement.
seta cod_optMovement "1"
seta cod_optSlide "1"
seta cod_optProne "1"
seta cod_optAiming "1"
seta cod_optRecoil "1"
seta cod_optWeapon "1"
seta cod_optRegen "0"
seta cod_optStamina "1"
seta cod_optAmmo "1"
seta cod_optHitMarkers "1"
seta cod_optEnemy "1"
seta cod_optTactics "1"

// Flashlight (CONTROLS / GAME menu).
seta cod_flashlightEnable "1"
seta cod_flashlightIntensity "500"
seta cod_flashlightR "0.8"
seta cod_flashlightG "0.75"
seta cod_flashlightB "0.65"

// Debug HUD and /cod_menu text+panel scale (0.5..1.0, also adjustable live in the MENU UI section).
seta cod_debugHud "0"
seta cod_menuScale "0.7"

// Input and audio.
// Mouse sensitivity default (engine default is 5).
seta sensitivity "2.5"
// Effects level (user playtest lock 2026-10-12: 1.0 for 3D/HRTF audio; engine default 0.8).
seta s_volume "1"
// Music level (engine default is 0.25).
seta s_musicvolume "0.5"
// HRTF binaural audio (OpenAL Soft).
seta s_alHRTF "1"
