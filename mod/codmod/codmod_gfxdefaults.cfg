// codmod recommended values for the GRAPHICS > ADVANCED settings.
// Applied on first launch / reset (via codmod_binds.cfg) and by the ADVANCED "Restore defaults" button.
// NOT exec'd every launch (codmod.cfg), so choices made in the menu persist. Latched cvars need Apply (vid_restart).
seta r_ssao "1"
seta r_shadowMapSize "2048"
seta r_shadowFilter "2"
seta r_drawSunRays "1"
seta r_dynamiclight "1"
seta r_ext_texture_filter_anisotropic "16"
seta r_texturemode "GL_LINEAR_MIPMAP_LINEAR"
// HD texture pack: picmip > 0 would discard its detail.
seta r_picmip "0"
seta r_picmip2 "0"
seta r_lodbias "0"
seta com_maxfpsMode "2"
