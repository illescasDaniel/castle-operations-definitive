// codmod recommended values for the GRAPHICS > ADVANCED settings (graphics-only subset of the user-facing defaults).
// exec'd by codmod_defaults.cfg (every launch, before wolfconfig, so saved menu choices win) and by the ADVANCED
// "Restore recommended defaults" button. Latched cvars need Apply (vid_restart).
seta r_shadowMapSize "2048"
seta r_shadowFilter "2"
seta r_flashlightShadowSize "2048"
seta r_ext_texture_filter_anisotropic "16"
seta r_texturemode "GL_LINEAR_MIPMAP_LINEAR"
// HD texture pack: picmip > 0 would discard its detail.
seta r_picmip "0"
seta r_picmip2 "0"
seta r_lodbias "0"
seta com_maxfpsMode "2"
seta r_codSpecular "1"
// Parallax Mapping (relief + self-shadowing; needs the local codmod_height.pk3, docs/parallax.md). The menu row
// drives all three; r_normalMapping must stay on for the baked _nh normals+height. All CVAR_LATCH.
seta r_parallaxMapping "2"
seta r_parallaxMapShadows "0"
seta r_normalMapping "1"
// Warp Parallax (only with Frame Warp = On; lives here so the ADVANCED "Restore recommended defaults" button resets it): r_frameWarpMesh 0 off, 1/2/3 = low/medium/high depth-grid detail of the 6-DoF mesh warp (removes strafe blur of the compositor presents). Default High. Needs Apply.
seta r_frameWarpMesh "3"
// Render scale (2026-11-05, under evaluation): 0.77 + FSR1 upscale (r_renderScaleFilter 1 = FSR1, 0 = bilinear). Latched; 1 = native.
// Lives here so the ADVANCED "Restore recommended defaults" button resets it; codmod_defaults.cfg execs this file.
seta r_renderScale "0.77"
seta r_renderScaleFilter "1"
// Sharpening, two independent settings (EDITFIELD rows, live): r_renderScaleSharp = FSR1 RCAS (-1 auto: off at render scale 1,
// 0.5 when upscaling; 0..1 explicit at any scale, 0 off, 1 max; stops = 2*(1-v)); r_dlsStrength = Denoised Luma Sharpening
// (0 off, 1 max). Here so Restore recommended defaults resets them.
seta r_renderScaleSharp "-1"
seta r_dlsStrength "0"
