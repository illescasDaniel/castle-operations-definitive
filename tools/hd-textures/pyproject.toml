[project]
name = "hd-textures"
version = "0.1.0"
description = "Local 2× AI upscale pipeline for RTCW SP textures (run against owned Steam pk3s)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"numpy>=2.0",
	"pillow>=10.4",
	"rich>=13.7",
	"spandrel>=0.4.1",
	"torch>=2.5.0",
	"torchvision>=0.20.0",
	"httpx>=0.27",
]

[project.scripts]
hd-textures = "hd_textures.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hd_textures"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
